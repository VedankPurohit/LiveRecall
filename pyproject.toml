[project]
name = "liverecall"
version = "0.1.1"
description = "Open-source screen recall with semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "numpy==1.26.0",
    "pillow==10.3.0",
    "requests>=2.32.4",
    "tqdm>=4.67.1",
    # Image processing
    "opencv-python==4.9.0.80",
    "opencv-python-headless==4.9.0.80",
    "scikit-image",
    # Screen capture (cross-platform)
    "mss>=9.0.0",
    # Database (SQLite + vector search)
    "sqlite-vec>=0.1.1",
    # ML / Embeddings (lazy loaded)
    "sentence-transformers==2.7.0",
    "torch==2.3.0",
    "transformers>=4.55.2",
    # OCR (lazy loaded, platform-specific)
    # Apple Vision via ocrmac (macOS only, uses native Vision framework)
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
    # Tesseract OCR (cross-platform fallback)
    "pytesseract>=0.3.10",
    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",
    # System tray
    "pystray>=0.19.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
liverecall = "main:main"
liverecall-tray = "tray.app:run_tray"

[tool.setuptools.packages.find]
include = ["core*", "api*", "tray*"]

[tool.pytest.ini_options]
testpaths = ["api/tests", "core/tests", "tray/tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --cov=core --cov=api --cov=tray --cov-report=term-missing"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
no_implicit_optional = false
exclude = ["build", "dist", "web", ".venv", ".*/tests"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
    # Type stubs
    "types-requests>=2.32.0",
]
