[project]
name = "liverecall"
version = "0.1.1"
description = "Open-source screen recall with semantic search"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # Core
    "numpy==1.26.0",
    "pillow==10.3.0",
    "requests>=2.32.4",
    "tqdm>=4.67.1",

    # Image processing
    "opencv-python==4.9.0.80",
    "opencv-python-headless==4.9.0.80",
    "scikit-image",

    # Screen capture (cross-platform)
    "mss>=9.0.0",

    # Database (SQLite + vector search)
    "sqlite-vec>=0.1.1",

    # ML / Embeddings (lazy loaded)
    "sentence-transformers==2.7.0",
    "torch==2.3.0",
    "transformers>=4.55.2",

    # API
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.0.0",

    # System tray
    "pystray>=0.19.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
]
build = [
    "pyinstaller>=6.0.0",
]

[project.scripts]
liverecall = "main:main"
liverecall-tray = "tray.app:run_tray"

[tool.setuptools.packages.find]
include = ["core*", "api*", "tray*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "httpx>=0.27.0",
    "pyinstaller>=6.0.0",
]
